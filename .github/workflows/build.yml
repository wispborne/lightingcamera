name: Build APK

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$RUNNER_TEMP/release.jks
          EOF

      - name: Work out the version
        id: version
        # Take the "major.minor" (e.g. 1.0) from pubspec.yaml and use the CI run
        # number as the patch, giving an always-rising version like 1.0.34.
        # Bump the major/minor later by editing pubspec.yaml.
        run: |
          base=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | cut -d'+' -f1)
          major_minor=$(echo "$base" | cut -d. -f1,2)
          echo "name=${major_minor}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build APK (arm64-v8a only)
        # Version name is stamped from the step above; build code is the run
        # number so it always goes up, which Android needs to treat each new
        # APK as an upgrade.
        run: >
          flutter build apk --release --target-platform android-arm64
          --build-name=${{ steps.version.outputs.name }}
          --build-number=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: app-arm64-release
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: v${{ steps.version.outputs.name }}
          body: |
            Version ${{ steps.version.outputs.name }} — automated release from commit ${{ github.sha }}.
          files: build/app/outputs/flutter-apk/app-release.apk
