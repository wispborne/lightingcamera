# Lightning Relay — shipped defaults.
#
# DO NOT edit this file for a deployment. Instead create a `config.yaml` (or
# `config.json`) next to it — that file is gitignored — and set only the keys you
# want to change; everything else falls back to the values here. You can also
# point at a config elsewhere with the RELAY_CONFIG environment variable.

# Upstream Blitzortung feed that the relay decodes and fans out to clients.
upstream:
  # Tried in order; the relay fails over to the next URL if a connection drops.
  urls:
    - wss://ws1.blitzortung.org/
    - wss://ws7.blitzortung.org/
    - wss://ws8.blitzortung.org/
  # Handshake message Blitzortung expects right after the socket opens.
  initMessage:
    a: 111

# The client-facing websocket server — the app connects here.
server:
  host: 0.0.0.0
  port: 8787
  # How often (ms) to ping each connected app. A ws-level ping reaps half-open
  # connections server-side; an app-level keepalive lets the client notice a dead
  # link. The app's stale timeout should stay above 2x this value.
  heartbeatMs: 30000
  # Terminate TLS here instead of at a reverse proxy. Leave disabled if Caddy or
  # nginx fronts the relay (the recommended setup).
  tls:
    enabled: false
    certPath: ""
    keyPath: ""

# Browser-facing world map: a static page plus a websocket that streams ALL strikes
# worldwide, with no relay-key auth. Authentication is the reverse proxy's job —
# put Caddy + tinyauth (forward_auth) in front and keep host on localhost so the
# port is unreachable any other way. Setting host to 0.0.0.0 would expose an
# unauthenticated world feed; don't.
web:
  enabled: false
  host: 127.0.0.1
  port: 8788
  # Ping cadence for web sockets, same semantics as server.heartbeatMs.
  heartbeatMs: 30000

# Rolling history of recent strikes, replayed to clients on connect so their maps
# start populated: app clients get their bounding box after subscribing, web
# viewers get the whole world. Covers the 5-minute display window.
history:
  # Cap on retained strikes so a worldwide peak can't grow memory unbounded.
  maxStrikes: 20000
  # Snapshot file so the history survives a relay restart. Relative paths resolve
  # against the relay directory. Set to "" to keep the history in memory only.
  snapshotPath: strike-history.json
  # How often (ms) to rewrite the snapshot while strikes are arriving.
  snapshotIntervalMs: 10000

# Permanent archive of every recorded strike, written in batches to a single
# SQLite database — separate from the rolling history above, which only keeps the
# last few minutes. Off by default; needs Node 22.5+ (uses the built-in
# node:sqlite). Querying is just SQL against the file; see relay/query-archive.js.
archive:
  enabled: false
  # Where to keep the database. Use an absolute path on the external SSD, e.g.
  # /mnt/ssd/lightning/strike-archive.db. A relative path resolves against the
  # relay directory (and is gitignored).
  dbPath: strike-archive.db
  # Write buffered strikes at least this often (ms)...
  flushIntervalMs: 5000
  # ...or sooner once this many are buffered, whichever comes first.
  batchSize: 1000

# Bounding-box limits applied to every subscription.
limits:
  # Largest radius (km) a client may request; bigger requests are clamped to this.
  maxBoxRadiusKm: 250

# Access control — the relay is private, so only keys listed here may connect.
auth:
  # Map of friendName -> key. Empty by default; add entries in your override file.
  # See the README for how to generate a key.
  keys: {}
  # Force a re-auth after this many hours so a revoked key stops working.
  maxSessionHours: 4
  # fail2ban-style IP banning for repeated bad keys.
  ban:
    # Ban once failures exceed this count within failureWindowSec.
    maxFailures: 5
    failureWindowSec: 60
    banDurationMin: 15
  # Most simultaneous connections allowed from a single IP.
  maxConnectionsPerIp: 10
  # Drop a connection that hasn't authenticated within this many seconds.
  authTimeoutSec: 10

# Drop upstream strikes older than this (ms) before fanning them out, so a feed
# backlog can't replay stale strikes onto the map.
maxStrikeAgeMs: 600000

# Upstream (Blitzortung) reconnect behaviour.
reconnect:
  # Backoff grows from backoffMs up to maxBackoffMs across successive retries.
  backoffMs: 1000
  maxBackoffMs: 30000
  # How often (ms) to ping the upstream to keep it alive and spot a dead feed.
  heartbeatMs: 30000

# Logging verbosity: error | warn | info | debug.
log:
  level: info
