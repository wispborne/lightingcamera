<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lightning Map</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="map"></div>

  <div id="status" class="pill">
    <span id="status-dot" class="dot"></span>
    <span id="status-text">connecting</span>
    <span id="strike-count"></span>
  </div>

  <div id="controls">
    <button id="sound-toggle" class="pill" type="button"
            title="Tick sound for strikes on screen">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/>
        <path d="M16.5 8.5a5 5 0 0 1 0 7" fill="none" stroke="currentColor"
              stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <span>Sound</span>
    </button>
    <button id="thunder-toggle" class="pill" type="button"
            title="Show thunder wave propagation">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <circle cx="12" cy="12" r="2.5" fill="currentColor"/>
        <circle cx="12" cy="12" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <circle cx="12" cy="12" r="10.5" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.5"/>
      </svg>
      <span>Thunder</span>
    </button>
    <button id="radar-toggle" class="pill" type="button"
            title="Show rain radar (RainViewer)">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path d="M7 14a4 4 0 0 1 .5-7.97 5 5 0 0 1 9.5 1.3A3.5 3.5 0 0 1 16.5 14H7z"
              fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M8 16.5l-1 2.5M12 16.5l-1 2.5M16 16.5l-1 2.5"
              fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <span>Radar</span>
    </button>
  </div>

  <div id="radar-opacity" class="pill" hidden>
    <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
      <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/>
    </svg>
    <input id="radar-opacity-slider" type="range" min="0" max="1" step="0.05"
           value="0.3" aria-label="Rain radar opacity">
  </div>

  <div id="note"></div>

  <script src="/vendor/leaflet/leaflet.js"></script>
  <script src="/app.js"></script>
</body>
</html>
